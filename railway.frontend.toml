# Config for the Railway frontend service only.
# Set RAILWAY_CONFIG_FILE=railway.frontend.toml on that service so it does not
# inherit the root railway.toml (backend Dockerfile + /health).

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.frontend"

[deploy]
healthcheckPath = "/admin/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
