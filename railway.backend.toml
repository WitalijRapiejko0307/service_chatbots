# API service only. Set RAILWAY_CONFIG_FILE=railway.backend.toml on service_chatbots.
# Do not keep a root railway.toml — it would apply the backend Dockerfile to frontend too.
#
# Frontend: railway.frontend.toml (RAILWAY_CONFIG_FILE on that service).
# See docs/deploy.md for env vars and HTTPS webhook notes.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.backend"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
